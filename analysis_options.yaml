include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    # A published library that lies in its docs is worse than one with none.
    public_member_api_docs: warning
  exclude:
    # A separate package with its own pubspec and analysis options.
    - example/**
    - build/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters
